<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    INDEX PAGE — editing guide
    ---------------------------
    This file only provides the empty stage (#app). All numbered links are
    built by script.js from the SITE.links list. styles.css places them.

    To add / move / change index links:
      1. Edit SITE.links in script.js (keys, numbers, labels, destinations,
         and which group they belong to: Work vs Info — see script.js).
      2. Edit desktop positions in styles.css (.slot[data-position="…"]).
      3. Mobile needs no extra files: the same links stack left-aligned
         automatically under @media (max-width: 768px) in styles.css.

    Push changes via GitHub Desktop so GitHub Pages updates the live site.
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jerome Sicard</title>
  <meta name="description" content="Jerome Sicard">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="script.js"></script>
</head>
<body>
  <main id="app" class="stage" aria-live="polite">
    <p class="status" id="status">Loading…</p>
  </main>
</body>
</html>

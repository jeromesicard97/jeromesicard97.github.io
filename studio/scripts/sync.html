<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Sanity sync helper</title></head>
<body>
  <p id="status">Ready</p>
  <script>
    window.runSync = async (token) => {
      const status = document.getElementById('status')
      try {
        const blocks = await fetch('./archive-blocks.json').then((r) => r.json())
        status.textContent = `Loaded ${blocks.length} blocks…`
        const mut = {
          mutations: [
            {
              patch: {
                id: 'archivePage',
                set: {title: 'Archive', blocks},
              },
            },
          ],
        }
        const r = await fetch(
          'https://20myx2jl.api.sanity.io/v2025-10-17/data/mutate/production?returnIds=true',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + token,
            },
            body: JSON.stringify(mut),
          },
        )
        const text = await r.text()
        status.textContent = `Archive ${r.status}: ${text}`
        return {status: r.status, body: text, blockCount: blocks.length}
      } catch (e) {
        status.textContent = String(e)
        return {err: String(e)}
      }
    }
  </script>
</body>
</html>
